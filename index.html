<script>
const commandes = {

    "beni-chantreel": {
        client: "Beni Mutoni",
        partenaire: "Chantreel Bkr",

        date: "29 octobre 2026",
        heure: "12h25",

        activites: {
            restaurant: {
                nom: "🍔 Restaurant",
                options: "Fast-food, Chawarma"
            },

            cinema: {
                nom: "🎬 Cinéma",
                options: "Cinéma public"
            },

            promenade: {
                nom: "🚶 Promenade / sortie",
                options: "Promenade"
            },

            jeux: {
                nom: "🎲 Jeux / divertissement",
                options: "Jeux de société"
            }
        }
    }

};


// Récupérer l'ID présent dans le lien
const params = new URLSearchParams(window.location.search);
const id = params.get("id");


// Chercher la commande
const commande = commandes[id];


// Si la commande existe
if (commande) {

    document.getElementById("client").textContent =
        commande.client;

    document.getElementById("partenaire").textContent =
        commande.partenaire;

    document.getElementById("date").textContent =
        commande.date;

    document.getElementById("heure").textContent =
        commande.heure;

    document.getElementById("restaurant").innerHTML =
        commande.activites.restaurant.nom +
        "<br><small>" +
        commande.activites.restaurant.options +
        "</small>";

    document.getElementById("cinema").innerHTML =
        commande.activites.cinema.nom +
        "<br><small>" +
        commande.activites.cinema.options +
        "</small>";

    document.getElementById("promenade").innerHTML =
        commande.activites.promenade.nom +
        "<br><small>" +
        commande.activites.promenade.options +
        "</small>";

    document.getElementById("jeux").innerHTML =
        commande.activites.jeux.nom +
        "<br><small>" +
        commande.activites.jeux.options +
        "</small>";

} else {

    document.body.innerHTML = `
        <div style="
        text-align:center;
        padding:50px;
        font-family:Arial;
        ">
        <h1>❤️ LoveLink</h1>
        <p>Cette invitation n'existe pas ou n'est plus disponible.</p>
        </div>
    `;
}
</script>
