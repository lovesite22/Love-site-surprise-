<div class="lovelink-builder" style="background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: 20px auto; font-family: sans-serif;">
    <h3 style="color: #e91e63; text-align: center;">💕 Crée son Expérience à Kinshasa</h3>
    
    <!-- 1. Choix de la Date -->
    <div style="margin-bottom: 15px;">
        <label style="font-weight: bold; display: block; margin-bottom: 5px;">📅 Choisis la date du rendez-vous :</label>
        <input type="date" id="rdvDate" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px;">
    </div>

    <!-- 2. Choix de l'Activité Principale -->
    <div style="margin-bottom: 15px;">
        <label style="font-weight: bold; display: block; margin-bottom: 5px;">🎯 Qu'est-ce qu'on fait ?</label>
        <select id="mainActivity" onchange="updateSubOptions()" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px;">
            <option value="">-- Sélectionne une activité --</option>
            <option value="Resto">🍽️ Restaurant / Manger</option>
            <option value="Glace">🍦 Glace & Douceur</option>
            <option value="Ciné">🎬 Cinéma / Divertissement</option>
        </select>
    </div>

    <!-- 3. Sous-menu dynamique selon Kinshasa -->
    <div style="margin-bottom: 20px;">
        <label style="font-weight: bold; display: block; margin-bottom: 5px;" id="subLabel">✨ Option spécifique :</label>
        <select id="subOption" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px;">
            <option value="">-- Choisis d'abord une activité --</option>
        </select>
    </div>

    <!-- Bouton d'envoi WhatsApp -->
    <button onclick="sendToWhatsApp()" style="background: #25D366; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;">
        📱 Envoyer ma configuration sur ton WhatsApp
    </button>
</div>

<script>
// Les options adaptées à Kinshasa
function updateSubOptions() {
    const main = document.getElementById("mainActivity").value;
    const subSelect = document.getElementById("subOption");
    const subLabel = document.getElementById("subLabel");
    
    subSelect.innerHTML = ""; // Vider les anciennes options
    
    if (main === "Resto") {
        subLabel.innerText = "🍽️ Choisis le style de repas :";
        const options = ["Tacos", "Chawarma", "Poulet frit", "Pizza", "Foufou / Liboke (Traditionnel)"];
        options.forEach(opt => {
            let el = document.createElement("option");
            el.value = opt;
            el.textContent = opt;
            subSelect.appendChild(el);
        });
    } else if (main === "Glace") {
        subLabel.innerText = "🍦 Choisis le glacier à Kinshasa :";
        // Glaciers locaux actualisés
        const options = [
            "Cremino (UPN)", 
            "Nice Cream (Ma Campagne / Bandal)", 
            "Glace & Chocolat (Gombe)", 
            "Caramel (Gombe)", 
            "Kis Sweet (Ngaliema)", 
            "Planet Ice (Limete)"
        ];
        options.forEach(opt => {
            let el = document.createElement("option");
            el.value = opt;
            el.textContent = opt;
            subSelect.appendChild(el);
        });
    } else if (main === "Ciné") {
        subLabel.innerText = "🎬 Choisis l'activité :";
        const options = ["Séance de Cinéma (Cinekin / Wallonie)", "Balade / Détente au Jardin Botanique (Gombe)", "Jeux / Bowling"];
        options.forEach(opt => {
            let el = document.createElement("option");
            el.value = opt;
            el.textContent = opt;
            subSelect.appendChild(el);
        });
    } else {
        subLabel.innerText = "✨ Option spécifique :";
        let el = document.createElement("option");
        el.value = "";
        el.textContent = "-- Choisis d'abord une activité --";
        subSelect.appendChild(el);
    }
}

// Fonction pour envoyer le tout vers ton WhatsApp
function sendToWhatsApp() {
    const date = document.getElementById("rdvDate").value;
    const activity = document.getElementById("mainActivity").value;
    const sub = document.getElementById("subOption").value;
    
    if(!date || !activity || !sub) {
        alert("S'il te plaît, remplis tous les champs avant d'envoyer !");
        return;
    }
    
    // Ton numéro WhatsApp professionnel configuré
    const tonNumero = "243998622741"; 
    
    const message = `Hello LoveLink ! Je veux commander une expérience pour ma copine :\n📅 Date : ${date}\n🎯 Activité : ${activity}\n📍 Option choisie : ${sub}`;
    
    const url = `https://wa.me/${tonNumero}?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank');
}
</script>
