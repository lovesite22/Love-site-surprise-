<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoveLink — Créez un moment inoubliable</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

:root{
  --rose:#d94770;
  --rose-dark:#b92f57;
  --soft:#fff4f7;
  --ink:#171318;
  --muted:#777078;
  --border:#eadfe3;
  --white:#fff;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:"DM Sans",sans-serif;
  background:linear-gradient(135deg,#fff7f9,#f8f4f6);
  color:var(--ink);
  min-height:100vh;
}

.container{
  width:min(720px,94%);
  margin:35px auto;
}

header{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  font-family:"Playfair Display",serif;
  font-size:38px;
  color:var(--rose);
}

.subtitle{
  color:var(--muted);
  margin-top:5px;
}

.card{
  background:white;
  border-radius:25px;
  padding:28px;
  box-shadow:0 15px 45px rgba(60,30,40,.09);
}

.progress{
  height:6px;
  background:#eee6e9;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:25px;
}

.progress-bar{
  height:100%;
  width:20%;
  background:var(--rose);
  transition:.3s;
}

.step-number{
  color:var(--rose);
  font-weight:700;
  font-size:13px;
  margin-bottom:8px;
}

h1{
  font-family:"Playfair Display",serif;
  font-size:30px;
  margin-bottom:8px;
}

.description{
  color:var(--muted);
  line-height:1.5;
  margin-bottom:25px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.option{
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  cursor:pointer;
  background:white;
  transition:.2s;
}

.option:hover{
  border-color:var(--rose);
}

.option.selected{
  background:var(--soft);
  border:2px solid var(--rose);
}

.option-title{
  font-weight:700;
  margin-bottom:4px;
}

.option-text{
  color:var(--muted);
  font-size:13px;
}

input,textarea{
  width:100%;
  padding:15px;
  border:1px solid var(--border);
  border-radius:14px;
  margin-top:8px;
  margin-bottom:18px;
  font-family:inherit;
  font-size:15px;
  outline:none;
}

input:focus,textarea:focus{
  border-color:var(--rose);
}

label{
  font-weight:600;
  font-size:14px;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:25px;
}

button{
  border:0;
  padding:15px 20px;
  border-radius:14px;
  font-family:inherit;
  font-weight:700;
  cursor:pointer;
  font-size:15px;
}

.back{
  background:#f1ecee;
  color:var(--ink);
  flex:1;
}

.next{
  background:var(--rose);
  color:white;
  flex:2;
}

.next:hover{
  background:var(--rose-dark);
}

.info{
  background:var(--soft);
  padding:18px;
  border-radius:17px;
  margin:15px 0;
}

.info strong{
  color:var(--rose);
}

.summary{
  background:#faf7f8;
  padding:18px;
  border-radius:17px;
  line-height:1.7;
  font-size:14px;
}

.payment{
  border:2px solid #f0d6df;
  background:#fff8fa;
  padding:20px;
  border-radius:18px;
  margin-top:20px;
}

.payment h3{
  margin-bottom:10px;
}

.payment p{
  margin:6px 0;
}

.small{
  font-size:13px;
  color:var(--muted);
}

.hidden{
  display:none;
}

.notice{
  margin-top:15px;
  padding:12px;
  background:#fff3f3;
  border-radius:12px;
  color:#a33;
  font-size:14px;
}

footer{
  text-align:center;
  color:#999;
  font-size:12px;
  margin-top:20px;
}

@media(max-width:550px){
  .container{
    margin:20px auto;
  }

  .card{
    padding:20px;
    border-radius:20px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  h1{
    font-size:26px;
  }

  .logo{
    font-size:32px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">LoveLink ❤️</div>
  <div class="subtitle">Créez un moment inoubliable.</div>
</header>

<div class="card">

<div class="progress">
  <div class="progress-bar" id="progress"></div>
</div>

<div id="app"></div>

<div class="buttons">
  <button class="back" id="backBtn" onclick="back()">Retour</button>
  <button class="next" id="nextBtn" onclick="next()">Continuer</button>
</div>

</div>

<footer>
  LoveLink — Création de sites romantiques personnalisés ❤️
</footer>

</div>

<script>

const WHATSAPP = "243998622741";

const activities = [
  ["🍽️","Restaurant","Un moment gourmand à deux"],
  ["🍦","Glace","Une petite douceur ensemble"],
  ["🎬","Cinéma","Un film et un moment complice"],
  ["🧺","Picnic","Un moment tranquille à deux"],
  ["🚶","Promenade / sortie","Une balade ou une sortie"],
  ["🎮","Jeux / divertissement","Un moment amusant"],
  ["📸","Photos / shooting","Créer de beaux souvenirs"],
  ["💝","Surprise romantique","Une attention spéciale"]
];

const foods = [
  "Tacos",
  "Chawarma",
  "Poulet frit",
  "Pizza",
  "Burger",
  "Pâtes",
  "Grillade",
  "Cuisine congolaise",
  "Fast-food",
  "Restaurant chic"
];

const drinks = [
  "Jus de fruit",
  "Coca",
  "Fanta",
  "Bavaria",
  "Savana",
  "Bière",
  "Whisky",
  "Vody",
  "Xtra",
  "Eau"
];

const iceCreams = [
  "Cremino — UPN",
  "Nice Cream — Macampagne",
  "Nice Cream — Bandal"
];

const cinema = [
  "Cinéma privé",
  "Cinéma public"
];

const picnic = [
  "Picnic au calme",
  "Picnic au coucher du soleil",
  "Picnic romantique",
  "Picnic + photos"
];

const promenade = [
  "Promenade",
  "Sortie en ville",
  "Balade + photos",
  "Sortie surprise"
];

const games = [
  "Jeux vidéo",
  "Bowling",
  "Jeux de société",
  "Activité ludique"
];

const photos = [
  "Shooting romantique",
  "Photos au coucher du soleil",
  "Photos de couple",
  "Mini séance surprise"
];

const surprises = [
  "Cadeau surprise",
  "Lettre romantique",
  "Chocolats",
  "Surprise personnalisée"
];

let step = 1;

let data = {
  activities:[],
  options:{},
  drinks:[],
  dateChoice:"",
  date:"",
  time:"",
  client:"",
  girlfriend:"",
  message:""
};

function render(){

  document.getElementById("progress").style.width =
    (step * 20) + "%";

  document.getElementById("backBtn").style.display =
    step === 1 ? "none" : "block";

  document.getElementById("nextBtn").textContent =
    step === 5 ? "Commander sur WhatsApp" : "Continuer";

  if(step === 1) renderActivities();
  if(step === 2) renderOptions();
  if(step === 3) renderDate();
  if(step === 4) renderNames();
  if(step === 5) renderPayment();
}


/* ÉTAPE 1 */

function renderActivities(){

  document.getElementById("app").innerHTML = `

    <div class="step-number">ÉTAPE 1 / 5</div>

    <h1>Choisissez 4 activités ❤️</h1>

    <p class="description">
      Sélectionnez exactement 4 activités.
      Elles seront proposées à votre partenaire
      sur son site personnalisé.
    </p>

    <div class="grid">

      ${activities.map((a,i)=>`

        <div class="option ${data.activities.includes(a[1])?'selected':''}"
             onclick="toggleActivity('${a[1]}')">

          <div style="font-size:28px">${a[0]}</div>

          <div class="option-title">${a[1]}</div>

          <div class="option-text">${a[2]}</div>

        </div>

      `).join("")}

    </div>

    <div class="info">
      <strong>${data.activities.length}/4</strong>
      activités sélectionnées
    </div>
  `;
}

function toggleActivity(name){

  if(data.activities.includes(name)){

    data.activities =
      data.activities.filter(x=>x!==name);

  }else{

    if(data.activities.length >= 4){

      alert("Vous devez sélectionner exactement 4 activités.");

      return;
    }

    data.activities.push(name);
  }

  renderActivities();
}


/* ÉTAPE 2 */

function renderOptions(){

  let html = `

    <div class="step-number">ÉTAPE 2 / 5</div>

    <h1>Personnalisez les activités</h1>

    <p class="description">
      Choisissez les détails qui apparaîtront
      sur le site de votre partenaire.
    </p>
  `;

  data.activities.forEach(activity=>{

    html += `
      <div class="info">
        <strong>${activity}</strong>
      </div>
    `;

    if(activity==="Restaurant"){

      html += makeOptions(
        "🍽️ Choix des plats",
        foods,
        "foods",
        4
      );

      html += makeOptions(
        "🥤 Choix des boissons",
        drinks,
        "drinks",
        4
      );

    }

    if(activity==="Glace"){

      html += makeOptions(
        "🍦 Choisissez les glaciers",
        iceCreams,
        "ice",
        4
      );

    }

    if(activity==="Cinéma"){

      html += makeOptions(
        "🎬 Type de cinéma",
        cinema,
        "cinema",
        1
      );

    }

    if(activity==="Picnic"){

      html += makeOptions(
        "🧺 Type de picnic",
        picnic,
        "picnic",
        4
      );

    }

    if(activity==="Promenade / sortie"){

      html += makeOptions(
        "🚶 Type de sortie",
        promenade,
        "promenade",
        4
      );

    }

    if(activity==="Jeux / divertissement"){

      html += makeOptions(
        "🎮 Type de divertissement",
        games,
        "games",
        4
      );

    }

    if(activity==="Photos / shooting"){

      html += makeOptions(
        "📸 Type de séance",
        photos,
        "photos",
        4
      );

    }

    if(activity==="Surprise romantique"){

      html += makeOptions(
        "💝 Type de surprise",
        surprises,
        "surprise",
        4
      );

    }

  });

  document.getElementById("app").innerHTML = html;
}

function makeOptions(title,list,key,max){

  if(!data.options[key])
    data.options[key]=[];

  return `

    <h3 style="margin:18px 0 10px">${title}</h3>

    <div class="grid">

      ${list.map(item=>`

        <div class="option
          ${data.options[key].includes(item)?'selected':''}"

          onclick="toggleOption('${key}','${item.replace(/'/g,"\\'")}',${max})">

          <div class="option-title">${item}</div>

        </div>

      `).join("")}

    </div>

    <p class="small" style="margin-top:8px">
      Jusqu'à ${max} choix
    </p>
  `;
}

function toggleOption(key,item,max){

  if(!data.options[key])
    data.options[key]=[];

  if(data.options[key].includes(item)){

    data.options[key] =
      data.options[key].filter(x=>x!==item);

  }else{

    if(data.options[key].length >= max){

      alert("Nombre maximum de choix atteint.");

      return;
    }

    data.options[key].push(item);
  }

  renderOptions();
}


/* ÉTAPE 3 */

function renderDate(){

  document.getElementById("app").innerHTML = `

    <div class="step-number">ÉTAPE 3 / 5</div>

    <h1>Qui choisit la date ?</h1>

    <p class="description">
      Vous pouvez choisir la date vous-même,
      ou laisser votre partenaire la choisir
      directement sur son site.
    </p>

    <div class="grid">

      <div class="option
        ${data.dateChoice==="Moi"?'selected':''}"
        onclick="chooseDate('Moi')">

        <div style="font-size:28px">🙋</div>

        <div class="option-title">Moi</div>

        <div class="option-text">
          Je choisis la date et l'heure.
        </div>

      </div>

      <div class="option
        ${data.dateChoice==="Elle"?'selected':''}"
        onclick="chooseDate('Elle')">

        <div style="font-size:28px">💑</div>

        <div class="option-title">Elle</div>

        <div class="option-text">
          Elle choisira la date sur son site.
        </div>

      </div>

    </div>

    ${data.dateChoice==="Moi" ? `

      <div style="margin-top:20px">

        <label>Date</label>
        <input
          type="date"
          id="date"
          value="${data.date}"
          onchange="data.date=this.value"
        >

        <label>Heure</label>
        <input
          type="time"
          id="time"
          value="${data.time}"
          onchange="data.time=this.value"
        >

      </div>

    ` : ""}

  `;
}

function chooseDate(choice){

  data.dateChoice=choice;

  renderDate();
}


/* ÉTAPE 4 */

function renderNames(){

  document.getElementById("app").innerHTML = `

    <div class="step-number">ÉTAPE 4 / 5</div>

    <h1>Quelques informations ❤️</h1>

    <p class="description">
      Ces informations permettent de personnaliser
      votre commande.
    </p>

    <label>Votre prénom / nom</label>
    <input
      placeholder="Ex : Hermann"
      value="${data.client}"
      oninput="data.client=this.value"
    >

    <label>Prénom de votre partenaire</label>
    <input
      placeholder="Ex : Philomenn"
      value="${data.girlfriend}"
      oninput="data.girlfriend=this.value"
    >

    <label>Message personnalisé <span class="small">(facultatif)</span></label>

    <textarea
      rows="5"
      placeholder="Votre petit message..."
      oninput="data.message=this.value"
    >${data.message}</textarea>

  `;
}


/* ÉTAPE 5 */

function renderPayment(){

  document.getElementById("app").innerHTML = `

    <div class="step-number">ÉTAPE 5 / 5</div>

    <h1>Votre commande est prête ❤️</h1>

    <p class="description">
      Votre site romantique personnalisé coûte
      <strong>7 $</strong> ou l'équivalent en francs congolais.
    </p>

    <div class="payment">

      <h3>💳 Paiement</h3>

      <p><strong>Airtel Money :</strong> 0998622741</p>

      <p><strong>M-Pesa :</strong> +243 828 373 914</p>

      <p class="small">
        Après le paiement, envoyez une capture
        ou une photo de la preuve de paiement
        sur WhatsApp.
      </p>

    </div>

    <div class="summary">

      <strong>Résumé de votre commande</strong>

      <br><br>

      👤 Client :
      ${data.client || "Non renseigné"}

      <br>

      ❤️ Partenaire :
      ${data.girlfriend || "Non renseigné"}

      <br><br>

      <strong>Activités :</strong>

      <br>

      ${data.activities.join("<br>")}

      <br><br>

      <strong>Date :</strong>

      ${data.dateChoice==="Moi"
        ? data.date+" à "+data.time
        : "Elle choisira la date"}

    </div>

    <div class="info">

      📲 Après avoir effectué le paiement,
      cliquez sur <strong>Commander sur WhatsApp</strong>.

      <br><br>

      Votre commande sera envoyée directement
      à LoveLink.

    </div>

  `;
}


/* NAVIGATION */

function next(){

  if(step===1){

    if(data.activities.length!==4){

      alert("Sélectionnez exactement 4 activités.");

      return;
    }
  }

  if(step===3){

    if(!data.dateChoice){

      alert("Choisissez qui choisira la date.");

      return;
    }

    if(data.dateChoice==="Moi" &&
       (!data.date || !data.time)){

      alert("Veuillez choisir la date et l'heure.");

      return;
    }
  }

  if(step===4){

    if(!data.client || !data.girlfriend){

      alert("Veuillez remplir les deux noms.");

      return;
    }
  }

  if(step===5){

    sendWhatsApp();

    return;
  }

  step++;

  render();
}

function back(){

  if(step>1){

    step--;

    render();

  }
}


/* WHATSAPP */

function sendWhatsApp(){

  let message = `

❤️ NOUVELLE COMMANDE LOVELINK ❤️

👤 Client :
${data.client}

❤️ Partenaire :
${data.girlfriend}

━━━━━━━━━━━━━━

🎯 ACTIVITÉS :

${data.activities.join("\n")}

━━━━━━━━━━━━━━

📋 OPTIONS :

`;

  for(const key in data.options){

    if(data.options[key].length){

      message +=
        "\n" +
        key.toUpperCase() +
        " :\n" +
        data.options[key].join(", ") +
        "\n";
    }
  }

  if(data.options.drinks &&
     data.options.drinks.length){

    message +=
      "\n🥤 BOISSONS :\n" +
      data.options.drinks.join(", ") +
      "\n";
  }

  message += `

━━━━━━━━━━━━━━

📅 DATE :

${data.dateChoice==="Moi"
  ? data.date+" à "+data.time
  : "Elle choisira la date"}

━━━━━━━━━━━━━━

💬 MESSAGE :

${data.message || "Aucun message"}

━━━━━━━━━━━━━━

💰 PRIX :
7 $ ou équivalent en francs congolais

📸 Preuve de paiement :
À envoyer dans cette conversation WhatsApp.

`;

  const url =
    "https://wa.me/" +
    WHATSAPP +
    "?text=" +
    encodeURIComponent(message);

  window.location.href = url;
}

render();

</script>

</body>
</html>
