<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour Philomenn Divine ❤️</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  color: white;
  text-align: center;
  min-height: 100vh;
}
.container {
  width: 92%;
  max-width: 500px;
  margin: auto;
  padding: 30px 15px 50px;
}
.heart {
  font-size: 60px;
  animation: beat 1s infinite;
}
@keyframes beat {
  50% {
    transform: scale(1.15);
  }
}
h1 {
  margin-bottom: 5px;
  font-size: 30px;
}
.subtitle {
  font-size: 17px;
  margin-bottom: 20px;
}
.message {
  font-size: 21px;
  font-weight: bold;
  margin: 20px 0;
}
.date {
  background: rgba(255,255,255,0.18);
  padding: 15px;
  border-radius: 18px;
  margin-bottom: 25px;
}
.instruction {
  background: rgba(255,255,255,0.18);
  padding: 16px;
  border-radius: 18px;
  margin-bottom: 18px;
  font-weight: bold;
}
.activities {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.activity {
  background: white;
  color: #e91e63;
  padding: 20px 10px;
  border-radius: 18px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}
.activity:hover,
.activity.selected {
  transform: scale(1.04);
  background: #ffe4ed;
}
.activity span {
  display: block;
  font-size: 35px;
  margin-bottom: 8px;
}
.subactivities {
  display: none;
  margin-top: 25px;
  background: rgba(255,255,255,0.16);
  padding: 20px;
  border-radius: 20px;
}
.subactivities h2 {
  margin-top: 0;
}
.option {
  background: white;
  color: #e91e63;
  padding: 14px;
  margin: 10px 0;
  border-radius: 14px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.2s;
}
.option.selected {
  background: #ffd6e3;
  transform: scale(1.02);
}
.confirm {
  display: none;
  margin-top: 25px;
}
button {
  border: none;
  padding: 16px 25px;
  border-radius: 30px;
  background: white;
  color: #e91e63;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
.note {
  font-size: 13px;
  opacity: 0.9;
  margin-top: 20px;
}
</style>
</head>
<body>
<div class="container">
  <div class="heart">❤️</div>
  <h1>Philomenn Divine</h1>
  <div class="subtitle">
    Une petite surprise de la part de Hermann ❤️
  </div>
  <div class="message">
    « Je t'aime » 💕
  </div>
  <div class="date">
    📅 <strong>30 septembre 2026</strong><br>
    🕛 <strong>12h10</strong>
  </div>
  <div class="instruction">
    💕 Choisis UNE activité parmi les 4 proposées
  </div>
  <div class="activities">
    <div class="activity" onclick="selectActivity('Restaurant', this)">
      <span>🍽️</span>
      Restaurant
    </div>
    <div class="activity" onclick="selectActivity('Crémerie', this)">
      <span>🍦</span>
      Crémerie
    </div>
    <div class="activity" onclick="selectActivity('Cinéma', this)">
      <span>🎬</span>
      Cinéma
    </div>
    <div class="activity" onclick="selectActivity('Picnic', this)">
      <span>🧺</span>
      Picnic
    </div>
  </div>
  <div id="subactivities" class="subactivities">
    <h2 id="subTitle"></h2>
    <p>
      Choisis maintenant ton option ❤️
    </p>
    <div id="options"></div>
  </div>
  <div id="confirm" class="confirm">
    <button onclick="sendResponse()">
      ❤️ Confirmer mon choix
    </button>
  </div>
  <div class="note">
    Ton choix sera envoyé directement à Hermann ❤️
  </div>
</div>
<script>
/*
==================================================
INFORMATIONS DE LA COMMANDE
==================================================
*/
// Numéro WhatsApp DU CLIENT.
// Pour une autre commande, remplace seulement ce numéro.
const numeroClient = "243828373914";
const nomClient = "Hermann";
const nomPartenaire = "Philomenn Divine";
const dateRendezVous = "30 septembre 2026 à 12h10";
const messageAmour = "Je t'aime";
/*
==================================================
VARIABLES
==================================================
*/
let selectedActivity = "";
let selectedOption = "";
/*
==================================================
CHOIX DE L'ACTIVITÉ
==================================================
*/
function selectActivity(activity, element) {
  selectedActivity = activity;
  selectedOption = "";
  document
    .querySelectorAll(".activity")
    .forEach(item => {
      item.classList.remove("selected");
    });
  element.classList.add("selected");
  const box = document.getElementById("subactivities");
  const title = document.getElementById("subTitle");
  const options = document.getElementById("options");
  box.style.display = "block";
  title.innerHTML =
    "💕 " + activity + " 💕";
  options.innerHTML = "";
  document.getElementById("confirm").style.display = "none";
  /*
  ================================
  RESTAURANT
  ================================
  */
  if (activity === "Restaurant") {
    addOption("🌮 Tacos");
    addOption("🥙 Chawarma");
    addOption("🥤 Coca");
    addOption("🥤 Fanta");
  }
  /*
  ================================
  CRÉMERIE
  ================================
  */
  if (activity === "Crémerie") {
    addOption("🍦 Cremino UPN");
    addOption("🍦 Nice Cream Macampagne");
    addOption("🍦 Nice Cream Bandal");
  }
  /*
  ================================
  CINÉMA
  ================================
  */
  if (activity === "Cinéma") {
    addOption("🎬 Cinéma privé");
    addOption("🎬 Cinéma public");
  }
  /*
  ================================
  PICNIC
  ================================
  */
  if (activity === "Picnic") {
    addOption("🧺 Picnic romantique");
  }
}
/*
==================================================
AJOUTER UNE SOUS-ACTIVITÉ
==================================================
*/
function addOption(text) {
  const div = document.createElement("div");
  div.className = "option";
  div.innerHTML = text;
  div.onclick = function() {
    document
      .querySelectorAll(".option")
      .forEach(item => {
        item.classList.remove("selected");
      });
    div.classList.add("selected");
    selectedOption = text;
    document.getElementById("confirm").style.display = "block";
  };
  document
    .getElementById("options")
    .appendChild(div);
}
/*
==================================================
ENVOYER LA RÉPONSE AU CLIENT
==================================================
*/
function sendResponse() {
  if (!selectedActivity || !selectedOption) {
    alert(
      "Choisis d'abord une activité et une option ❤️"
    );
    return;
  }
  const texte =
`❤️ LOVELINK ❤️
Salut ${nomClient} ! 🥰
${nomPartenaire} vient de faire son choix.
🎯 ACTIVITÉ :
${selectedActivity}
📋 OPTION :
${selectedOption}
📅 DATE :
${dateRendezVous}
💬 MESSAGE :
${messageAmour} ❤️
━━━━━━━━━━━━━━
💕 Ton/ta partenaire a confirmé son choix !`;
  const url =
    "https://wa.me/" +
    numeroClient +
    "?text=" +
    encodeURIComponent(texte);
  window.location.href = url;
}
</script>
</body>
</html>
